name: BB Alert

on:
  schedule:
    - cron: "*/5 * * * *"      # ทุก 5 นาที (GitHub อาจช้าไปบ้าง)
  workflow_dispatch:
    inputs:
      send_test:
        description: "ส่งข้อความทดสอบเข้า Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bb-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MESSAGE: ${{ inputs.send_test }}
          # ปรับค่าได้ที่นี่ เช่น COOLDOWN_SEC: 900, ESC_STEP: 1.0, USE_TFS: "H1,H4,D1"
          CHECK_MODE: wick
        run: python alert.py

      # เตือนล่วงหน้าก่อนข่าวแรงออก (ถ้าพังจะไม่กระทบตัวเช็ค BB)
      - name: News reminder
        if: ${{ !inputs.send_test }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWS_CURRENCIES: "USD"
          NEWS_IMPACTS: "High"
          REMIND_MINUTES: "30"      # ใส่ "30,10" ถ้าอยากเตือน 2 ครั้ง
        run: python news_brief.py remind

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "bb-alert-bot"
            git config user.email "bb-alert-bot@users.noreply.github.com"
            git add state.json news_state.json 2>/dev/null || true
            git commit -m "update state" || true
            git push || true
          fi
