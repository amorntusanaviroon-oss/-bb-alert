name: News Brief

# ไม่มีตารางเวลาของ GitHub แล้ว: ให้ cron-job.org สั่งรันทุกเช้า 07:00 เวลาไทย (ผ่าน workflow_dispatch)
# กดรันเองได้ที่แท็บ Actions > News Brief > Run workflow
on:
  workflow_dispatch:

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Send news brief
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # ปรับได้ เช่น NEWS_IMPACTS: "High,Medium"  NEWS_CURRENCIES: "USD,EUR"
          NEWS_CURRENCIES: "USD"
          NEWS_IMPACTS: "High"
          # วันหมดอายุของโทเคน GitHub ที่ใส่ใน cron-job.org (YYYY-MM-DD) ระบบจะเตือนใน Telegram ล่วงหน้า
          # ถ้าสร้างโทเคนใหม่ อย่าลืมแก้วันที่นี้ด้วย
          TOKEN_EXPIRES: "2027-10-08"
        run: python news_brief.py
